# Supabase CLI config for local development (`supabase start`, `supabase db reset`).
# Hosted projects are configured in the dashboard, see README "Supabase setup".
project_id = "pho-xin-viec-3d"

[api]
enabled = true
port = 54321
# `private` is never exposed
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 3000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# the app signs everyone in anonymously
enable_anonymous_sign_ins = true
enable_signup = true

[auth.rate_limit]
anonymous_users = 30
